[package]
name = "devfolio-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
gloo-timers = { version = "0.4.0", features = ["futures"] }
icondata = "0.7.0"
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_icons = "0.7.1"
lucide-leptos = { version = "3.63.0", features = ["all-icons"] }
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "Window",
    "Document",
    "Element",
    "DomTokenList",
    "EventTarget",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "HtmlElement",
    "ScrollToOptions",
] }
